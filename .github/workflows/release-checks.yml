name: Release checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    name: release-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Check the isolated release
        run: pnpm check:release
      - name: Record verification scope
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Release checks passed: lint, types, offline tests, production build, and Chromium flows.

          The check ran in an isolated source copy with no provider or database credentials.
          Sample and browser fixtures do not measure live answer quality or production latency.
          No paid evaluation, deployment, artifact upload, or budget reset is part of this workflow.
          SUMMARY
